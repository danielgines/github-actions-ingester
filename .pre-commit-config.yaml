# Pre-commit hooks for github-actions-ingester.
#
# Install once with:    just install
# Or manually:          uv sync --extra dev && pre-commit install --install-hooks
#
# Two-stage strategy:
#   pre-commit (every commit, fast):
#     - ruff lint + format, mypy strict, yamllint, hadolint, actionlint,
#       gitleaks, helm lint, built-in file fixers
#   pre-push (slower, before sharing):
#     - pytest full suite, helm template smoke render
#
# Run all hooks against all files (CI parity):
#   pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------
  # Generic file hygiene
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.svg$
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-yaml
        # Helm templates contain Go template directives that are not valid
        # YAML until rendered; yamllint skips them for the same reason.
        args: [--allow-multiple-documents, --unsafe]
        exclude: ^helm/.*/templates/
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
        # The manifest-flow test uses a throwaway RSA key to sign a JWT.
        exclude: ^tests/
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------------
  # Python — ruff (lint + format)
  # ---------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep aligned with the ruff version uv installs from the dev extra.
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ---------------------------------------------------------------------
  # YAML lint — strict on real config, lenient on Helm
  # ---------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yaml]

  # ---------------------------------------------------------------------
  # Dockerfile lint
  # ---------------------------------------------------------------------
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.12.1b3
    hooks:
      - id: hadolint
        args:
          # Base images are pinned by tag on purpose (DL3007); apt packages
          # are upgraded for fresh patches, pinning would defeat that (DL3008).
          - --ignore=DL3007
          - --ignore=DL3008

  # ---------------------------------------------------------------------
  # GitHub Actions workflow lint
  # ---------------------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.4
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------------
  # Secret scanner
  # ---------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------------------------------------------------------------------
  # Local hooks — use uv / helm already installed in the dev env
  # ---------------------------------------------------------------------
  - repo: local
    hooks:
      # pyproject.toml [project].version is canonical; this hook copies it
      # into __init__.py + Chart.yaml and fails the commit when it had to.
      - id: sync-version
        name: sync-version (pyproject → __init__.py + Chart.yaml)
        language: system
        entry: python3 scripts/sync-version.py
        files: ^(pyproject\.toml|src/github_actions_ingester/__init__\.py|helm/github-actions-ingester/Chart\.yaml|scripts/sync-version\.py)$
        pass_filenames: false

      - id: mypy
        name: mypy strict (src)
        language: system
        entry: uv run mypy src
        files: ^src/.*\.py$
        pass_filenames: false

      - id: helm-lint
        name: helm lint
        language: system
        entry: helm lint helm/github-actions-ingester
        files: ^helm/
        pass_filenames: false

      - id: helm-template-smoke
        name: helm template smoke
        language: system
        entry: bash -c 'helm template t helm/github-actions-ingester --set auth.token=test --set database.url=postgresql://u:p@db/gha --set config.orgs=acme --set networkPolicy.enabled=true --set serviceMonitor.enabled=true --set prometheusRule.enabled=true >/dev/null'
        files: ^helm/
        pass_filenames: false

      - id: pytest
        name: pytest (full suite)
        language: system
        entry: uv run pytest -q
        pass_filenames: false
        stages: [pre-push]
