[project]
name = "github-actions-ingester"
version = "0.2.1"
description = "Standalone GitHub Actions ingester — pulls workflows, runs and jobs from the GitHub API into PostgreSQL for Grafana dashboards, FinOps and alerting. Prometheus /metrics for ingester health and scheduled-workflow liveness."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Gines" }]
keywords = ["github", "github-actions", "ci", "postgres", "grafana", "prometheus", "finops", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "croniter>=3.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
    "structlog>=24.1",
]

[project.urls]
Homepage = "https://github.com/danielgines/github-actions-ingester"
Repository = "https://github.com/danielgines/github-actions-ingester"
Issues = "https://github.com/danielgines/github-actions-ingester/issues"

[project.scripts]
github-actions-ingester = "github_actions_ingester.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "types-croniter>=3.0",
    # Embedded PostgreSQL for local tests; ships wheels for 3.11/3.12 only.
    # CI uses a service container and GHA_TEST_DATABASE_URL instead.
    "pgserver>=0.1.4; python_version < '3.13'",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The sdist is the Python package, not the repository: chart, examples
# and CI live on GitHub.
include = ["src/", "tests/", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/github_actions_ingester"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.per-file-ignores]
# server.py subclasses BaseHTTPRequestHandler whose dispatch convention
# requires `do_<METHOD>` (uppercase HTTP method) — Python's http.server
# only invokes handlers matching this exact name. Disabling N802 here.
"src/github_actions_ingester/server.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pgserver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a live PostgreSQL (GHA_TEST_DATABASE_URL or pgserver)"]
