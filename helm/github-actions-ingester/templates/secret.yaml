{{- /*
  Chart-managed Secrets — only rendered from inline values. With
  auth.existingSecret / database.existingSecret the chart consumes the
  operator's Secrets (typically written by External Secrets) instead.
*/ -}}
{{- if and (not .Values.auth.existingSecret) (or .Values.auth.token .Values.auth.app.id) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-actions-ingester.authSecretName" . }}
  labels:
    {{- include "github-actions-ingester.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.token }}
  GHA_GITHUB_TOKEN: {{ .Values.auth.token | quote }}
  {{- end }}
  {{- if .Values.auth.app.id }}
  GHA_GITHUB_APP_ID: {{ .Values.auth.app.id | quote }}
  GHA_GITHUB_APP_PRIVATE_KEY: {{ .Values.auth.app.privateKey | quote }}
  {{- with .Values.auth.app.installationId }}
  GHA_GITHUB_APP_INSTALLATION_ID: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if and (not .Values.database.existingSecret) .Values.database.url }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "github-actions-ingester.databaseSecretName" . }}
  labels:
    {{- include "github-actions-ingester.labels" . | nindent 4 }}
type: Opaque
stringData:
  GHA_DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
