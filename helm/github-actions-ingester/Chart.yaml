      description: Initial release — GitHub App / PAT auth, incremental ingestion of runs and jobs into PostgreSQL with self-managed schema migrations, dashboard 24157 compatibility views, scheduled-workflow liveness metrics, Helm chart with NetworkPolicy, PDB, compliance HPA, ServiceMonitor and PrometheusRule.
