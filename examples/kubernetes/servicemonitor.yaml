# Prometheus Operator scrape target (rendered from the chart with serviceMonitor.enabled=true).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: github-actions-ingester
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: github-actions-ingester
      app.kubernetes.io/instance: github-actions-ingester
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
      honorLabels: false
