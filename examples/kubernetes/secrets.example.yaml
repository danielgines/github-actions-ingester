# The two Secrets the chart consumes through `auth.existingSecret` and
# `database.existingSecret`. Create them out of band (kubectl, External
# Secrets Operator, Sealed Secrets...). Values below are placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-ingester-github
  namespace: github-actions-ingester
type: Opaque
stringData:
  # GitHub App (recommended) ...
  GHA_GITHUB_APP_ID: "123456"
  # Paste the PEM generated by GitHub (github-app.pem) as a block scalar,
  # or point GHA_GITHUB_APP_PRIVATE_KEY_FILE at a mounted file instead.
  GHA_GITHUB_APP_PRIVATE_KEY: "<contents of github-app.pem>"
  # ... OR a personal access token (remove the App keys if you use this)
  # GHA_GITHUB_TOKEN: ghp_xxx
---
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-ingester-database
  namespace: github-actions-ingester
type: Opaque
stringData:
  GHA_DATABASE_URL: postgresql://gha:change-me@postgres-rw.databases.svc:5432/gha?sslmode=require
